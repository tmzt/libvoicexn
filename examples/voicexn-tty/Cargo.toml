[package]
name = "voicexn-tty"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "libvoicexn in a terminal: it hears a sentence, prints it and says it back with Phonon"

[[bin]]
name = "voicexn-tty"
path = "src/main.rs"

[dependencies]
# A session on the default input and output devices.
libvoicexn = { path = "../..", features = ["cpal"] }
env_logger = "0.11"
log = "0.4"

# The library's features, forwarded.
[features]
default = []
vad-earshot = ["libvoicexn/vad-earshot"]
stt-moshi-xn-boost = ["libvoicexn/stt-moshi-xn-boost"]
