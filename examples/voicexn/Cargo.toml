[package]
name = "voicexn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "libvoicexn's demo: Phonon text-to-speech and Kyutai speech-to-text on xn, in a libmorph app"

[lib]
name = "voicexn"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "voicexn"
path = "src/main.rs"

[dependencies]
libvoicexn = { path = "../.." }
# Its own libmorph revision: libvoicexn has no libmorph (plan 20261029_01,
# decision 2); the audio ends are joined by two closures in src/lib.rs.
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "bb0174d14f77e4b54a250e78293b3a9cb4a6617a" }
# The revision libcontrols pins, so the graph holds one libmsdf.
libmsdf = { git = "https://github.com/tmzt/libmsdf", rev = "b48d0664a4222ffd1fe505962d13459fbadb5034", features = ["font-apache-roboto-regular"] }
libcontrols = { git = "https://github.com/tmzt/libcontrols", rev = "ccb783dd64b88d3d7ad20d07b7919a5177ab332d" }
log = "0.4"

# The library's features, forwarded, so build.rs and scripts/android.sh
# see the same names.
[features]
default = []
stt-moshi-xn = ["libvoicexn/stt-moshi-xn"]
vad-earshot = ["stt-moshi-xn", "libvoicexn/vad-earshot"]
stt-moshi-xn-boost = ["stt-moshi-xn", "libvoicexn/stt-moshi-xn-boost"]

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "bb0174d14f77e4b54a250e78293b3a9cb4a6617a", features = ["mobile"] }
android_logger = "0.14"

# Generates the Gradle project when building for Android; a no-op on the host.
[build-dependencies]
libmorph-build = { git = "https://github.com/tmzt/libmorph", rev = "bb0174d14f77e4b54a250e78293b3a9cb4a6617a" }
