# xn picks its kernels at compile time. These are the flags of
# xn-ptts/android/build.sh: ARMv8.2 dotprod and fp16 for the fast q8_0
# kernels, and 16 KB page alignment for Android 15. aarch64-apple-darwin
# needs nothing: its default target-cpu, apple-m1, already has both.
[target.aarch64-linux-android]
rustflags = [
  "-C", "target-cpu=generic",
  "-C", "target-feature=+dotprod,+fp16",
  "-C", "link-arg=-Wl,-z,max-page-size=16384",
]
