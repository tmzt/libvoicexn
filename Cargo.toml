[package]
name = "libvoicexn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Speech in and out on xn: Phonon text-to-speech and Kyutai speech-to-text, without ONNX"

[lib]
name = "libvoicexn"

[dependencies]
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "bb0174d14f77e4b54a250e78293b3a9cb4a6617a" }
log = "0.4"
# The realtime-safe ring between the tts thread and the audio thread.
rtrb = "0.3"
# Kyutai STT through xn (plan 20261022_02), behind `stt-moshi-xn`.
xn-moshi = { version = "0.2.6", optional = true }
xn = { version = "0.2.12", optional = true }
serde_json = { version = "1", optional = true }
# Voice activity detection in pure Rust (plan 20261022_03), behind `vad-earshot`.
earshot = { version = "1.2.2", optional = true }
# Phonon on xn, CPU only; `hf` reads the checkpoint's tokenizer.json.
# 0.4.1 (tag v0.4.1) is not on crates.io yet.
ptts = { git = "https://github.com/gradium-ai/xn-ptts", rev = "49b9033e44ab0fbb935973eca3213757644d1bbb", features = ["hf"] }

[features]
default = []
# Live speech-to-text with Kyutai's stt-1b-en_fr on xn-moshi.
stt-moshi-xn = ["dep:xn-moshi", "dep:xn", "dep:serde_json"]
# Tap to talk: earshot opens and closes the gate to the STT model.
vad-earshot = ["stt-moshi-xn", "dep:earshot"]
# Bias STT toward a phrase list, vocab.txt (plan 20261022_04).
stt-moshi-xn-boost = ["stt-moshi-xn"]

[workspace]
members = [".", "examples/voicexn"]

[profile.dev.package."*"]
opt-level = 2
