[package]
name = "libvoicexn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "A minimal realtime speech example: Phonon text-to-speech on xn, in a libmorph app"

[lib]
name = "libvoicexn"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "voicexn"
path = "src/main.rs"

[dependencies]
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "bb0174d14f77e4b54a250e78293b3a9cb4a6617a" }
# The revision libcontrols pins, so the graph holds one libmsdf.
libmsdf = { git = "https://github.com/tmzt/libmsdf", rev = "b48d0664a4222ffd1fe505962d13459fbadb5034", features = ["font-apache-roboto-regular"] }
libcontrols = { git = "https://github.com/tmzt/libcontrols", rev = "ccb783dd64b88d3d7ad20d07b7919a5177ab332d" }
log = "0.4"
# The realtime-safe ring between the tts thread and the audio thread.
rtrb = "0.3"
# Kyutai STT through xn (plan 20261022_02), behind `stt-moshi-xn`.
xn-moshi = { version = "0.2.6", optional = true }
xn = { version = "0.2.12", optional = true }
serde_json = { version = "1", optional = true }
# Voice activity detection in pure Rust (plan 20261022_03), behind `vad-earshot`.
earshot = { version = "1.2.2", optional = true }
# Phonon on xn, CPU only; `hf` reads the checkpoint's tokenizer.json.
# 0.4.1 (tag v0.4.1) is not on crates.io yet.
ptts = { git = "https://github.com/gradium-ai/xn-ptts", rev = "49b9033e44ab0fbb935973eca3213757644d1bbb", features = ["hf"] }

[features]
default = []
# Live speech-to-text with Kyutai's stt-1b-en_fr on xn-moshi.
stt-moshi-xn = ["dep:xn-moshi", "dep:xn", "dep:serde_json"]
# Tap to talk: earshot opens and closes the gate to the STT model.
vad-earshot = ["stt-moshi-xn", "dep:earshot"]
# Bias STT toward a phrase list, vocab.txt (plan 20261022_04).
stt-moshi-xn-boost = ["stt-moshi-xn"]

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
libmorph = { git = "https://github.com/tmzt/libmorph", rev = "bb0174d14f77e4b54a250e78293b3a9cb4a6617a", features = ["mobile"] }
android_logger = "0.14"

# Generates the Gradle project when building for Android; a no-op on the host.
[build-dependencies]
libmorph-build = { git = "https://github.com/tmzt/libmorph", rev = "bb0174d14f77e4b54a250e78293b3a9cb4a6617a" }

[profile.dev.package."*"]
opt-level = 2
